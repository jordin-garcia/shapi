name: shapi

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${SHAPI_POSTGRES_USUARIO:-shapi}
      POSTGRES_PASSWORD: ${SHAPI_POSTGRES_CONTRASENA:-shapi_desarrollo}
      POSTGRES_DB: ${SHAPI_POSTGRES_BASE_DATOS:-shapi}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${SHAPI_POSTGRES_USUARIO:-shapi} -d ${SHAPI_POSTGRES_BASE_DATOS:-shapi}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  borde:
    image: caddy:2
    depends_on:
      mailpit:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:2019/config/",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

volumes:
  pgdata:
  redisdata:
  caddydata:

networks:
  default:
    name: shapi
