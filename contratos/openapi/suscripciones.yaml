openapi: 3.1.0
info:
  title: API de Suscripciones de Shapi
  version: 1.0.0
paths:
  /api/admin/demo/reloj:
    get:
      summary: Consulta la fecha de demostración (solo administrador)
      operationId: consultarRelojDemo
      responses:
        "200":
          description: Fecha actual del servidor, con el desplazamiento aplicado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FechaServidor" }
        "401":
          description: Sin sesión del personal
        "403":
          description: Requiere el rol administrador
        "404":
          description: Solo está disponible con `SHAPI_MODO_DEMO=true`
    post:
      summary: Adelanta el reloj de demostración y dispara el cierre de ciclo
      operationId: adelantarRelojDemo
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PeticionRelojDemo" }
      responses:
        "204":
          description: Reloj adelantado y cierre de ciclo solicitado
        "400":
          description: La cantidad debe estar entre 1 y 365 días (`datos_invalidos`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problema" }
        "404":
          description: Solo está disponible con `SHAPI_MODO_DEMO=true`
  /api/reloj:
    get:
      summary: Consulta la hora de negocio para las pantallas del personal
      operationId: consultarFechaServidor
      responses:
        "200":
          description: Hora de IReloj e inicio del día de negocio en Guatemala
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FechaServidor" }
        "401":
          description: Sin sesión del personal
  /api/portal/reloj:
    get:
      summary: Consulta la hora de negocio para el consumidor del portal
      operationId: consultarFechaPortal
      responses:
        "200":
          description: Hora de IReloj e inicio del día de negocio en Guatemala
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FechaServidor" }
        "401":
          description: Sin sesión de consumidor válida para este portal
  /api/suscripcion:
    get:
      summary: Consulta la suscripción de plataforma de la organización
      operationId: obtenerSuscripcionPlataforma
      responses:
        "200":
          description: Plan, estado, periodo, tarjeta y cambio programado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuscripcionPlataforma"
        "404":
          description: No existe una suscripción vigente
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
  /api/suscripcion/uso:
    get:
      summary: Consulta el consumo de cuota de la suscripción de plataforma
      operationId: obtenerUsoSuscripcionPlataforma
      responses:
        "200":
          description: Peticiones utilizadas, cuota y porcentaje del ciclo actual
          content:
            application/json:
              schema:
                type: object
                required: [peticiones, cuotaPeticiones, porcentaje]
                properties:
                  peticiones: { type: integer, format: int64 }
                  cuotaPeticiones: { type: integer, format: int64 }
                  porcentaje: { type: number }
        "404":
          description: No existe una suscripción vigente
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problema" }
        "503":
          description: Redis no está disponible para consultar el uso de cuota (`servicio_no_disponible`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problema" }
  /api/suscripcion/contratar:
    post:
      summary: Contrata un plan de plataforma
      operationId: contratarPlanPlataforma
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PeticionSuscripcionPlataforma"
      responses:
        "201":
          description: Plan contratado y datos del ciclo activado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResultadoContratacionPlataforma"
        "400":
          description: Datos inválidos o no hay tarjeta registrada (`datos_invalidos`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problema" }
        "402":
          description: La pasarela rechazó el cobro (`pago_rechazado`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problema" }
        "404":
          description: Plan no encontrado
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problema" }
        "409":
          description: Ya existe una suscripción de pago vigente
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problema" }
        "422":
          description: Tarjeta inválida o vencida
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problema" }
        "503":
          description: La pasarela de pagos no está disponible (`pasarela_no_disponible`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problema" }
  /api/suscripcion/cambiar:
    post:
      summary: Cambia o programa un cambio de plan de plataforma
      operationId: cambiarPlanPlataforma
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PeticionSuscripcionPlataforma"
      responses:
        "200":
          description: Cambio aplicado, contratado desde plan de prueba/gratuito, sin cambios o programado. Si el destino no incluye dominio propio, los dominios se desconectan al aplicar el cambio; una bajada programada los conserva hasta la renovación y cancelarla los conserva.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ResultadoCambioProrrateado"
                  - $ref: "#/components/schemas/ResultadoContratacionPlataforma"
                  - $ref: "#/components/schemas/ResultadoCambioProgramado"
                  - $ref: "#/components/schemas/ResultadoSinCambios"
        "400":
          description: Datos inválidos o no hay tarjeta registrada (`datos_invalidos`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problema" }
        "402":
          description: La pasarela rechazó el cobro (`pago_rechazado`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problema" }
        "404":
          description: Suscripción o plan no encontrado
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problema" }
        "422":
          description: Tarjeta inválida o vencida, u organización fuera de los límites del plan
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problema" }
        "503":
          description: La pasarela de pagos no está disponible (`pasarela_no_disponible`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problema" }
  /api/suscripcion/cambio-programado:
    delete:
      summary: Cancela el cambio de plan programado
      operationId: cancelarCambioPlanPlataforma
      responses:
        "204": { description: Cambio cancelado }
  /api/suscripcion/pagar:
    post:
      summary: Paga y reactiva un plan de pago en gracia o suspendido
      operationId: pagarSuscripcionPlataforma
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PeticionPagoPlataforma"
      responses:
        "200":
          description: Suscripción reactivada con el ciclo nuevo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResultadoPagoSuscripcionPlataforma"
        "400":
          description: Datos inválidos o no hay tarjeta registrada (`datos_invalidos`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problema" }
        "402":
          description: La pasarela rechazó el cobro (`pago_rechazado`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problema" }
        "404":
          description: No hay una suscripción que requiera pago
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problema" }
        "422":
          description: Tarjeta inválida o vencida, o el plan es Prueba o gratuito (`requiere_plan_de_pago`); debe contratar un plan de pago
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problema" }
        "503":
          description: La pasarela de pagos no está disponible (`pasarela_no_disponible`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problema" }
  /api/portal/suscripciones:
    post:
      summary: Contrata un plan de API y emite sus claves
      operationId: contratarPlanApi
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PeticionContratarPlan"
      responses:
        "201":
          description: Suscripción activa y claves mostradas una sola vez
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contratacion"
        "400":
          description: |
            Datos inválidos (`datos_invalidos`), con el error en cada campo de `errores`: falta la tarjeta que pide un
            plan de pago (`tarjeta`), o el mes, el año de vencimiento o el titular no son válidos
            (`tarjeta.mesVencimiento`, `tarjeta.anioVencimiento` y `tarjeta.titular`). El formato del vencimiento
            se valida antes de enviar la tarjeta a la pasarela.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
        "402":
          description: La pasarela rechazó el pago; el motivo aparece en detalle
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
        "409":
          description: Ya existe una suscripción vigente en esta API
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
        "422":
          description: |
            Correo sin verificar (`correo_no_verificado`), plan inactivo (`plan_no_encontrado`) o tarjeta que la
            pasarela no acepta (`numero_invalido`, `marca_no_soportada`, `tarjeta_vencida` o `cvv_invalido`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
        "404":
          description: |
            Portal o consumidor no encontrado (`api_no_encontrada`), o plan que no es de esta API
            (`plan_no_encontrado`)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
        "503":
          description: |
            La pasarela de pagos no respondió al tokenizar o al cobrar (`pasarela_no_disponible`). No se registra
            ningún pago. Si el cobro se autorizó pero la contratación falla después, se reembolsa.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
  /api/portal/suscripcion:
    get:
      summary: Consulta la suscripción del consumidor en la API del portal
      operationId: obtenerSuscripcionApi
      responses:
        "200":
          description: Suscripción, periodo mostrado, renovación, tarjeta y límites
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuscripcionActual"
        "404":
          description: |
            No existe una suscripción vigente (`suscripcion_no_encontrada`), o portal o consumidor no encontrado
            (`api_no_encontrada`)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
  /api/portal/suscripcion/cambio-programado:
    delete:
      summary: Cancela la bajada programada del consumidor en esta API
      operationId: cancelarCambioProgramadoApi
      responses:
        "204":
          description: Cambio cancelado; también si no había un cambio programado
        "401":
          description: Sin sesión de consumidor
        "403":
          description: Sin permiso o falta la cabecera X-Requested-With
        "404":
          description: |
            Portal o consumidor no encontrado (`api_no_encontrada`), o no hay una suscripción vigente
            (`suscripcion_no_encontrada`)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
  /api/portal/suscripcion/pagar:
    post:
      summary: Reactiva la suscripción API del consumidor en gracia o suspendida
      operationId: reactivarSuscripcionApi
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tarjeta]
              properties:
                tarjeta: { $ref: "#/components/schemas/Tarjeta" }
      responses:
        "200":
          description: Suscripción reactivada con un ciclo nuevo desde hoy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResultadoReactivacionSuscripcionApi" }
        "400":
          description: |
            Falta la tarjeta (`tarjeta`), o el mes, el año de vencimiento o el titular no son válidos
            (`tarjeta.mesVencimiento`, `tarjeta.anioVencimiento` o `tarjeta.titular`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problema" }
        "402":
          description: La pasarela rechazó el pago
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problema" }
        "404":
          description: |
            Portal o consumidor no encontrado (`api_no_encontrada`), o no hay una suscripción por reactivar
            (`suscripcion_no_encontrada`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problema" }
        "422":
          description: La tarjeta no es válida o la suscripción no es de pago
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problema" }
        "503":
          description: La pasarela no está disponible
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problema" }
  /api/portal/suscripcion/cambiar:
    post:
      summary: Cambia o programa un cambio de plan del consumidor
      operationId: cambiarPlanSuscripcionApi
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [planId]
              properties:
                planId: { type: string, format: uuid }
                tarjeta: { $ref: "#/components/schemas/Tarjeta" }
      responses:
        "200":
          description: Cambio prorrateado, plan cambiado, sin cambios o cambio programado
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ResultadoCambioSuscripcionApi"
                  - $ref: "#/components/schemas/ResultadoCambioProgramado"
                  - $ref: "#/components/schemas/ResultadoSinCambios"
        "400":
          description: |
            Falta la tarjeta (`tarjeta`), o el mes, el año de vencimiento o el titular no son válidos
            (`tarjeta.mesVencimiento`, `tarjeta.anioVencimiento` o `tarjeta.titular`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problema" }
        "402":
          description: La pasarela rechazó el pago y no se cambió el plan
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problema" }
        "404":
          description: |
            Portal o consumidor no encontrado (`api_no_encontrada`), sin suscripción activa
            (`suscripcion_no_encontrada`) o plan activo no encontrado (`plan_no_encontrado`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problema" }
        "503":
          description: La pasarela no está disponible
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problema" }
components:
  schemas:
    FechaServidor:
      type: object
      required: [ahora, inicioCiclo, finClaveAnteriorPrevisto]
      properties:
        ahora: { type: string, format: date-time }
        inicioCiclo:
          type: string
          format: date-time
          description: Inicio del día actual en America/Guatemala, según IReloj
        finClaveAnteriorPrevisto:
          type: string
          format: date-time
          description: Previsión de ahora más 24 horas; la rotación confirma la fecha definitiva
    PeticionRelojDemo:
      type: object
      required: [adelantarDias]
      properties:
        adelantarDias: { type: integer, minimum: 1, maximum: 365 }
    ResultadoContratacionPlataforma:
      type: object
      required: [id, plan, estado, periodo, proximaRenovacion, tarjetaEnmascarada]
      properties:
        id: { type: string, format: uuid }
        plan:
          type: object
          required: [id, nombre, precio, moneda, vigenciaDias]
          properties:
            id: { type: string, format: uuid }
            nombre: { type: string }
            precio: { type: number }
            moneda: { type: string, const: GTQ }
            vigenciaDias: { type: integer }
        estado: { type: string, const: activa }
        periodo:
          type: object
          required: [inicio, fin]
          properties:
            inicio: { type: string, format: date-time }
            fin: { type: string, format: date-time }
        proximaRenovacion: { type: string, format: date-time }
        tarjetaEnmascarada: { type: [string, "null"] }
    ResultadoCambioProrrateado:
      type: object
      required: [estado, credito, cargo, aPagar, inicio, fin]
      properties:
        estado: { type: string, const: activa }
        credito: { type: number }
        cargo: { type: number }
        aPagar: { type: number }
        inicio: { type: string, format: date-time }
        fin: { type: string, format: date-time }
    ResultadoCambioProgramado:
      type: object
      required: [estado, planSiguienteId, efectivoDesde]
      properties:
        estado: { type: string, const: programado }
        planSiguienteId: { type: string, format: uuid }
        efectivoDesde: { type: string, format: date-time }
    ResultadoSinCambios:
      type: object
      required: [estado]
      properties:
        estado: { type: string, const: sin_cambios }
    ResultadoPagoSuscripcionPlataforma:
      type: object
      required: [estado, inicio, fin]
      properties:
        estado: { type: string, const: activa }
        inicio: { type: string, format: date-time }
        fin: { type: string, format: date-time }
    ResultadoReactivacionSuscripcionApi:
      type: object
      required: [estado, inicio, fin]
      properties:
        estado: { type: string, const: activa }
        inicio: { type: string, format: date-time }
        fin: { type: string, format: date-time }
    ResultadoCambioSuscripcionApi:
      type: object
      required: [estado, credito, cargo, aPagar, inicio, fin, claves]
      properties:
        estado: { type: string, const: activa }
        credito: { type: number }
        cargo: { type: number }
        aPagar: { type: number }
        inicio: { type: string, format: date-time }
        fin: { type: string, format: date-time }
        claves:
          type: array
          items:
            $ref: "#/components/schemas/ClaveEmitida"
    PeticionSuscripcionPlataforma:
      type: object
      required: [planId]
      properties:
        planId: { type: string, format: uuid }
        usarRegistrada: { type: boolean, default: false }
        tarjeta:
          oneOf:
            - $ref: "#/components/schemas/Tarjeta"
            - type: "null"
    PeticionPagoPlataforma:
      type: object
      properties:
        usarRegistrada: { type: boolean, default: false }
        tarjeta:
          oneOf:
            - $ref: "#/components/schemas/Tarjeta"
            - type: "null"
    SuscripcionPlataforma:
      type: object
      required: [plan, estado, periodo, proximaRenovacion]
      properties:
        plan:
          type: object
          required: [id, nombre, descripcion, precio, moneda, vigenciaDias, maxApis, maxMiembros, cuotaPeticiones, dominioPropio, esPrueba]
          properties:
            id: { type: string, format: uuid }
            nombre: { type: string }
            descripcion: { type: string }
            precio: { type: number }
            moneda: { type: string, const: GTQ }
            vigenciaDias: { type: integer }
            maxApis: { type: [integer, "null"] }
            maxMiembros: { type: [integer, "null"] }
            cuotaPeticiones: { type: integer, format: int64 }
            dominioPropio: { type: boolean }
            esPrueba: { type: boolean }
        estado: { type: string, enum: [activa, en_gracia, suspendida, finalizada] }
        periodo:
          type: object
          required: [inicio, fin]
          properties:
            inicio: { type: string, format: date-time }
            fin: { type: string, format: date-time }
        proximaRenovacion: { type: string, format: date-time }
        tarjetaEnmascarada: { type: [string, "null"] }
        graciaHasta: { type: [string, "null"], format: date-time }
        graciaDesde: { type: [string, "null"], format: date-time }
        periodoVigente: { type: boolean }
        pagoRevertido:
          oneOf:
            - type: object
              required: [fecha, monto]
              properties:
                fecha: { type: string, format: date-time }
                monto: { type: number }
            - type: "null"
        avisoPrueba:
          description: Solo durante los siete días anteriores al fin de una Prueba activa, según IReloj
          oneOf:
            - type: object
              required: [venceEn]
              properties:
                venceEn: { type: string, format: date-time }
            - type: "null"
        diasRestantesCiclo: { type: integer }
        diasRestantes: { type: integer }
        ultimoRechazoEn: { type: [string, "null"], format: date-time }
        consumidoresAfectados: { type: integer }
        cambioProgramado:
          oneOf:
            - type: object
              properties:
                planId: { type: string, format: uuid }
                nombre: { type: string }
                efectivoDesde: { type: string, format: date-time }
                desconectaDominios: { type: boolean, description: Al aplicar el cambio se desconectarán los dominios propios porque el plan de destino no los incluye. }
            - type: "null"
    PeticionContratarPlan:
      type: object
      required: [planId]
      properties:
        planId:
          type: string
          format: uuid
        tarjeta:
          oneOf:
            - $ref: "#/components/schemas/Tarjeta"
            - type: "null"
    Tarjeta:
      type: object
      required: [numero, mesVencimiento, anioVencimiento, cvv, titular]
      properties:
        numero: { type: string }
        mesVencimiento: { type: string }
        anioVencimiento: { type: string }
        cvv: { type: string }
        titular: { type: string }
    Contratacion:
      type: object
      required: [suscripcion, medioPago, claves]
      properties:
        suscripcion:
          $ref: "#/components/schemas/Suscripcion"
        medioPago:
          oneOf:
            - type: object
              required: [marca, ultimos4]
              properties:
                marca: { type: string, enum: [Visa, Mastercard, "American Express"] }
                ultimos4: { type: string, pattern: '^[0-9]{4}$' }
            - type: "null"
        claves:
          type: array
          minItems: 2
          maxItems: 2
          items:
            $ref: "#/components/schemas/ClaveEmitida"
    Suscripcion:
      type: object
      required: [id, apiId, planId, nombrePlan, estado, inicio, fin, proximaRenovacion]
      properties:
        id: { type: string, format: uuid }
        apiId: { type: string, format: uuid }
        planId: { type: string, format: uuid }
        nombrePlan: { type: string }
        estado: { type: string, enum: [activa, en_gracia, suspendida, finalizada] }
        inicio: { type: string, format: date-time }
