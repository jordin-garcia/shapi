openapi: 3.1.0
info:
  title: API de Control - APIs
  version: 1.0.0
  description: |
    Registro, especificación, rutas, dominios, personalización del portal y publicación de las APIs de una organización (DC-04 a DC-06, DC-12 y DC-13).
    La sesión viaja en la cookie `shapi_sesion` y los métodos no seguros exigen
    `X-Requested-With: shapi`.
servers:
  - url: https://shapi.localhost

paths:
  /api/apis:
    get:
      summary: Lista las APIs de la organización
      operationId: listarApis
      security:
        - cookieSesion: []
      responses:
        '200':
          description: APIs visibles para la organización de la sesión y límites de su plan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaApis'
        '401':
          $ref: '#/components/responses/SinSesion'
        '403':
          $ref: '#/components/responses/SinPermiso'
    post:
      summary: Registra una API
      description: |
        Valida el subdominio y la URL contra SSRF, prueba el origen con un GET de hasta
        cinco segundos y, si responde con cualquier código HTTP, guarda la API en borrador.
        El secreto de origen se devuelve en claro solo en esta respuesta.
      operationId: registrarApi
      security:
        - cookieSesion: []
      parameters:
        - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PeticionRegistroApi'
      responses:
        '201':
          description: API registrada; el secreto no se vuelve a mostrar.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiRegistrada'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/SinSesion'
        '403':
          $ref: '#/components/responses/SinPermisoOCsrf'
        '409':
          description: El subdominio ya pertenece a otra API (`subdominio_ocupado`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
        '422':
          description: El origen está prohibido (`origen_no_permitido`), no respondió (`origen_inaccesible`) o se alcanzó el límite de APIs del plan (`limite_del_plan`, `detalle.limite = apis`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'

  /api/apis/{id}/especificacion:
    put:
      summary: Carga la especificación OpenAPI de una API
      description: Extrae sus operaciones y reconcilia las rutas existentes sin perder su configuración.
      operationId: cargarEspecificacionApi
      security:
        - cookieSesion: []
      parameters:
        - $ref: '#/components/parameters/ApiId'
        - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [archivo]
              properties:
                archivo:
                  type: string
                  format: binary
                  description: OpenAPI 3.0 o 3.1 en JSON o YAML, de hasta 2 MB.
      responses:
        '200':
          description: Especificación validada y rutas reconciliadas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EspecificacionCargada'
        '400':
          description: Falta la parte `archivo` del formulario (`datos_invalidos`, con `errores.archivo`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
        '401':
          $ref: '#/components/responses/SinSesion'
        '403':
          $ref: '#/components/responses/SinPermisoOCsrf'
        '404':
          $ref: '#/components/responses/ApiNoEncontrada'
        '422':
          description: |
            Documento inválido (`especificacion_invalida`). `detalle.ubicacion` lleva la línea o la sección y
            `detalle.mensaje`, el motivo en español. Si el error viene de la biblioteca que lee el documento,
            `detalle.detalleTecnico` lleva su mensaje original, en inglés.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'

  /api/apis/{id}/rutas:
    get:
      summary: Lista las rutas extraídas de una API
      description: |
        La pueden consultar todos los roles con permiso para ver APIs, incluido el lector (04 §3.1).
        Incluye el resumen de la especificación cargada, o `null` si todavía no se ha cargado.
      operationId: listarRutasApi
      security:
        - cookieSesion: []
      parameters:
        - $ref: '#/components/parameters/ApiId'
      responses:
        '200':
          description: Rutas en el orden de la especificación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaRutas'
        '401':
          $ref: '#/components/responses/SinSesion'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/ApiNoEncontrada'

  /api/apis/{id}/rutas/exposicion:
    put:
      summary: Expone u oculta rutas de una API
      operationId: actualizarExposicionRutasApi
      security:
        - cookieSesion: []
      parameters:
        - $ref: '#/components/parameters/ApiId'
        - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/CambioExposicionRuta'
      responses:
        '200':
          description: Exposición actualizada y resumen vigente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaRutas'
        '400':
          description: |
            Lote inválido (`datos_invalidos`): un elemento nulo, sin `rutaId` o sin `expuesta`, o una ruta repetida.
            `errores` usa la posición del elemento como clave, por ejemplo `[0].expuesta`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
        '401':
          $ref: '#/components/responses/SinSesion'
        '403':
          $ref: '#/components/responses/SinPermisoOCsrf'
        '404':
          description: |
            La API no existe o es de otra organización, o una de las rutas no es de la API (`api_no_encontrada`).
            No se cambia ninguna ruta.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'

  /api/apis/{id}/configuracion-rutas:
    put:
      summary: Configura el consumo de las rutas de una API
      operationId: configurarRutasApi
      security:
        - cookieSesion: []
      parameters:
        - $ref: '#/components/parameters/ApiId'
        - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/ConfiguracionRuta'
      responses:
        '200':
          description: Configuración guardada; si la API está publicada, también se republicó en Redis.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaRutas'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/SinSesion'
        '403':
          $ref: '#/components/responses/SinPermisoOCsrf'
        '404':
          $ref: '#/components/responses/ApiNoEncontrada'

  /api/apis/{id}/publicar:
    post:
      summary: Publica una API
      operationId: publicarApi
      security:
        - cookieSesion: []
      parameters:
        - $ref: '#/components/parameters/ApiId'
        - $ref: '#/components/parameters/XRequestedWith'
      responses:
        '200':
          description: API publicada y configuración enviada a la compuerta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstadoPublicacionApi'
        '401':
          $ref: '#/components/responses/SinSesion'
        '403':
          $ref: '#/components/responses/SinPermisoOCsrf'
        '404':
          $ref: '#/components/responses/ApiNoEncontrada'
        '422':
          description: Correo sin verificar o configuración incompleta.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'

  /api/apis/{id}/despublicar:
    post:
      summary: Despublica una API sin borrar sus datos
      operationId: despublicarApi
      security:
        - cookieSesion: []
      parameters:
        - $ref: '#/components/parameters/ApiId'
        - $ref: '#/components/parameters/XRequestedWith'
      responses:
        '200':
          description: API despublicada y configuración reenviada a la compuerta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstadoPublicacionApi'
        '401':
          $ref: '#/components/responses/SinSesion'
        '403':
          $ref: '#/components/responses/SinPermisoOCsrf'
        '404':
          $ref: '#/components/responses/ApiNoEncontrada'

  /api/apis/{id}/dominio:
    get:
      summary: Consulta las direcciones, el secreto enmascarado y el dominio propio
      operationId: obtenerDominioApi
      security: [{ cookieSesion: [] }]
      parameters: [{ $ref: '#/components/parameters/ApiId' }]
      responses:
        '200':
          description: Configuración de dominios de la API.
          content: { application/json: { schema: { $ref: '#/components/schemas/EstadoDominioPropio' } } }
        '401': { $ref: '#/components/responses/SinSesion' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/ApiNoEncontrada' }
    post:
      summary: Conecta o reemplaza el dominio propio
      operationId: conectarDominioApi
      security: [{ cookieSesion: [] }]
      parameters:
        - { $ref: '#/components/parameters/ApiId' }
        - { $ref: '#/components/parameters/XRequestedWith' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PeticionDominioPropio' } } }
      responses:
        '200':
          description: Dominio pendiente de verificación.
          content: { application/json: { schema: { $ref: '#/components/schemas/EstadoDominioPropio' } } }
        '400':
          description: Dominio inválido, reservado para Shapi o conectado a otra API (`datos_invalidos`).
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problema' } } }
        '401': { $ref: '#/components/responses/SinSesion' }
        '403': { $ref: '#/components/responses/SinPermisoOCsrf' }
        '404': { $ref: '#/components/responses/ApiNoEncontrada' }
        '422':
          description: El plan no incluye dominio propio (`plan_sin_dominio_propio`).
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problema' } } }
    delete:
      summary: Desconecta el dominio propio
      operationId: eliminarDominioApi
      security: [{ cookieSesion: [] }]
      parameters:
        - { $ref: '#/components/parameters/ApiId' }
        - { $ref: '#/components/parameters/XRequestedWith' }
      responses:
        '204': { description: Dominio desconectado. }
        '401': { $ref: '#/components/responses/SinSesion' }
        '403': { $ref: '#/components/responses/SinPermisoOCsrf' }
        '404': { $ref: '#/components/responses/ApiNoEncontrada' }

  /api/apis/{id}/dominio/simular-registro:
    post:
      summary: Crea el CNAME en el DNS simulado
      operationId: simularRegistroDominio
      security: [{ cookieSesion: [] }]
      parameters:
        - { $ref: '#/components/parameters/ApiId' }
        - { $ref: '#/components/parameters/XRequestedWith' }
      responses:
        '204': { description: Registro simulado creado. }
        '401': { $ref: '#/components/responses/SinSesion' }
        '403': { $ref: '#/components/responses/SinPermisoOCsrf' }
        '404': { $ref: '#/components/responses/ApiNoEncontrada' }

  /api/apis/{id}/dominio/verificar:
    post:
      summary: Verifica el CNAME del dominio propio
      operationId: verificarDominioApi
      security: [{ cookieSesion: [] }]
      parameters:
        - { $ref: '#/components/parameters/ApiId' }
        - { $ref: '#/components/parameters/XRequestedWith' }
      responses:
        '200':
          description: Resultado de la verificación.
          content: { application/json: { schema: { $ref: '#/components/schemas/EstadoDominioPropio' } } }
        '401': { $ref: '#/components/responses/SinSesion' }
        '403': { $ref: '#/components/responses/SinPermisoOCsrf' }
        '404': { $ref: '#/components/responses/ApiNoEncontrada' }

  /api/apis/{id}/secreto/regenerar:
    post:
      summary: Regenera el secreto de origen
      operationId: regenerarSecretoOrigen
      security: [{ cookieSesion: [] }]
      parameters:
        - { $ref: '#/components/parameters/ApiId' }
        - { $ref: '#/components/parameters/XRequestedWith' }
      responses:
        '200':
          description: El secreto nuevo se muestra únicamente en esta respuesta.
          content: { application/json: { schema: { $ref: '#/components/schemas/SecretoOrigenRegenerado' } } }
        '401': { $ref: '#/components/responses/SinSesion' }
        '403': { $ref: '#/components/responses/SinPermisoOCsrf' }
        '404': { $ref: '#/components/responses/ApiNoEncontrada' }

  /interno/tls/autorizar:
    get:
      summary: Autoriza la emisión bajo demanda de TLS para un dominio verificado
      operationId: autorizarTlsDominio
      security: []
      parameters:
        - name: domain
          in: query
          required: true
          schema: { type: string }
      responses:
        '200': { description: El dominio está verificado. }
        '404': { description: El dominio no está verificado o la petición no viene de una red privada. }

  /api/apis/{id}/portal:
    get:
      summary: Consulta la personalización del portal y los datos de su vista previa
      operationId: obtenerPersonalizacionPortal
      security: [{ cookieSesion: [] }]
      parameters: [{ $ref: '#/components/parameters/ApiId' }]
      responses:
        '200':
          description: Personalización actual del portal y datos para la vista previa de inicio.
          content: { application/json: { schema: { $ref: '#/components/schemas/PersonalizacionPortal' } } }
        '401': { $ref: '#/components/responses/SinSesion' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/ApiNoEncontrada' }
    put:
      summary: Actualiza el nombre, el color principal y el texto de bienvenida del portal
      operationId: actualizarPersonalizacionPortal
      security: [{ cookieSesion: [] }]
      parameters:
        - { $ref: '#/components/parameters/ApiId' }
        - { $ref: '#/components/parameters/XRequestedWith' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PeticionPersonalizacionPortal' } } }
      responses:
        '200':
          description: Personalización guardada.
          content: { application/json: { schema: { $ref: '#/components/schemas/PersonalizacionPortal' } } }
        '400': { $ref: '#/components/responses/DatosInvalidos' }
        '401': { $ref: '#/components/responses/SinSesion' }
        '403': { $ref: '#/components/responses/SinPermisoOCsrf' }
        '404': { $ref: '#/components/responses/ApiNoEncontrada' }

  /api/apis/{id}/portal/logo:
    get:
      summary: Descarga el logotipo del portal de una API desde el panel
      operationId: obtenerLogoPortalApi
      security: [{ cookieSesion: [] }]
      parameters: [{ $ref: '#/components/parameters/ApiId' }]
      responses:
        '200':
          description: "Logotipo en PNG o SVG (`Content-Security-Policy: sandbox` para SVG)."
          content:
            image/png: { schema: { type: string, format: binary } }
            image/svg+xml: { schema: { type: string, format: binary } }
        '401': { $ref: '#/components/responses/SinSesion' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/ApiNoEncontrada' }
    put:
      summary: Sube o reemplaza el logotipo del portal de una API
      operationId: cargarLogoPortalApi
      security: [{ cookieSesion: [] }]
      parameters:
        - { $ref: '#/components/parameters/ApiId' }
        - { $ref: '#/components/parameters/XRequestedWith' }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [archivo]
              properties:
                archivo:
                  type: string
                  format: binary
                  description: Imagen PNG o SVG de hasta 512 KB.
      responses:
        '200':
          description: Logotipo guardado y personalización vigente.
          content: { application/json: { schema: { $ref: '#/components/schemas/PersonalizacionPortal' } } }
        '401': { $ref: '#/components/responses/SinSesion' }
        '403': { $ref: '#/components/responses/SinPermisoOCsrf' }
        '404': { $ref: '#/components/responses/ApiNoEncontrada' }
        '422':
          description: "Logotipo inválido (`logo_invalido`): ausente, mayor de 512 KB o con formato distinto de PNG o SVG."
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problema' } } }

components:
  securitySchemes:
    cookieSesion:
      type: apiKey
      in: cookie
      name: shapi_sesion

  parameters:
    ApiId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    XRequestedWith:
      name: X-Requested-With
      in: header
      required: true
      description: Protección CSRF; el cliente del frontend la agrega siempre.
      schema:
        type: string
        const: shapi

  responses:
    ApiNoEncontrada:
      description: La API no existe o pertenece a otra organización.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
    DatosInvalidos:
      description: Datos inválidos (`datos_invalidos`), con errores por campo.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
    SinSesion:
      description: No hay una sesión vigente.
      content:
        application/problem+json:
          schema:
            type: object
            properties:
              title:
                type: string
              status:
                type: integer
    SinPermiso:
      description: La sesión no tiene permiso para consultar APIs.
      content:
        application/problem+json:
          schema:
            type: object
            properties:
              title:
                type: string
              status:
                type: integer
    SinPermisoOCsrf:
      description: La sesión no puede configurar APIs o falló la protección CSRF (`csrf`).
      content:
        application/problem+json:
          schema:
            anyOf:
              - $ref: '#/components/schemas/ProblemaEstandar'
              - $ref: '#/components/schemas/Problema'

  schemas:
    ProblemaEstandar:
      type: object
      description: ProblemDetails estándar, sin código de negocio.
      required: [title, status]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer

    PeticionRegistroApi:
      type: object
      required: [nombre, urlOrigen, subdominio]
      properties:
        nombre:
          type: string
          minLength: 1
        urlOrigen:
          type: string
          format: uri
        subdominio:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{1,28}[a-z0-9]$'

    ApiResumen:
      type: object
      required: [id, nombre, subdominio, estado]
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
        subdominio:
          type: string
        estado:
          type: string
          enum: [borrador, publicada, despublicada]

    ListaApis:
      type: object
      required: [elementos, total, planNombre, maxApis]
      properties:
        elementos:
          type: array
          items:
            $ref: '#/components/schemas/ApiResumen'
        total:
          type: integer
          minimum: 0
        planNombre:
          type: string
        maxApis:
          description: Nulo para los planes sin límite de APIs.
          oneOf:
            - type: integer
              minimum: 1
            - type: 'null'

    ApiRegistrada:
      type: object
      required: [id, nombre, subdominio, estado, secretoOrigen, conexionMilisegundos]
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
        subdominio:
          type: string
        estado:
          type: string
          const: borrador
        secretoOrigen:
          type: string
          pattern: '^shps_[A-Za-z0-9]{32}$'
          description: Se muestra una sola vez.
        conexionMilisegundos:
          type: integer
          minimum: 0

    RutaAdministrada:
      type: object
      required: [id, metodo, patron, expuesta, limiteMinuto, cacheSegundos, pesoLlamadas]
      properties:
        id:
          type: string
          format: uuid
        metodo:
          type: string
          enum: [GET, POST, PUT, PATCH, DELETE, HEAD, OPTIONS]
        patron:
          type: string
        resumen:
          type: [string, 'null']
        descripcion:
          type: [string, 'null']
        expuesta:
          type: boolean
        limiteMinuto:
          description: Nulo cuando la ruta no tiene límite propio.
          oneOf:
            - type: integer
              minimum: 1
            - type: 'null'
        cacheSegundos:
          type: integer
          minimum: 0
          maximum: 86400
        pesoLlamadas:
          type: integer
          minimum: 1
          maximum: 1000

    ConfiguracionRuta:
      type: object
      required: [rutaId, cacheSegundos, pesoLlamadas]
      properties:
        rutaId:
          type: string
          format: uuid
        limiteMinuto:
          description: Se omite o se envía nulo para quitar el límite propio.
          oneOf:
            - type: integer
              minimum: 1
            - type: 'null'
        cacheSegundos:
          type: integer
          minimum: 0
          maximum: 86400
          description: Solo puede ser mayor que cero en rutas GET.
        pesoLlamadas:
          type: integer
          minimum: 1
          maximum: 1000

    EstadoPublicacionApi:
      type: object
      required: [id, estado, publicadaEn, urlApi, urlPortal]
      properties:
        id:
          type: string
          format: uuid
        estado:
          type: string
          enum: [publicada, despublicada]
        publicadaEn:
          description: Fecha de la publicación más reciente; se conserva al despublicar.
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        urlApi:
          type: string
          format: uri
        urlPortal:
          type: string
          format: uri

    PeticionDominioPropio:
      type: object
      required: [dominio]
      properties:
        dominio: { type: string, example: api.enviosxelaju.localhost }

    EstadoDominioPropio:
      type: object
      required: [apiId, apiNombre, urlPortal, urlApi, secretoEnmascarado, modoSimulado, dominio, destinoCname, estado, motivo, verificadoEn]
      properties:
        apiId: { type: string, format: uuid }
        apiNombre: { type: string }
        urlPortal: { type: string, format: uri }
        urlApi: { type: string, format: uri }
        secretoEnmascarado: { type: string }
        modoSimulado: { type: boolean }
        dominio: { type: [string, 'null'] }
        destinoCname: { type: [string, 'null'] }
        estado: { type: [string, 'null'], enum: [pendiente, verificado, fallido, null] }
        motivo: { type: [string, 'null'] }
        verificadoEn:
          oneOf: [{ type: string, format: date-time }, { type: 'null' }]

    SecretoOrigenRegenerado:
      type: object
      required: [secretoOrigen]
      properties:
        secretoOrigen:
          type: string
          pattern: '^shps_[A-Za-z0-9]{32}$'
          description: Se muestra una sola vez.

    ResumenEspecificacion:
      type: object
      description: La especificación que la API tiene cargada. No se guarda el nombre del archivo.
      required: [titulo, version, versionOpenApi, formato, cargadaEn, tamanoBytes]
      properties:
        titulo:
          type: string
        version:
          type: string
        versionOpenApi:
          type: string
          example: 3.0.3
        formato:
          type: string
          enum: [json, yaml]
        cargadaEn:
          type: string
          format: date-time
        tamanoBytes:
          type: integer
          minimum: 1

    ListaRutas:
      type: object
      required: [apiId, apiNombre, elementos, totalExpuestas, totalOcultas, especificacion]
      properties:
        apiId:
          type: string
          format: uuid
        apiNombre:
          type: string
        elementos:
          type: array
          items:
            $ref: '#/components/schemas/RutaAdministrada'
        totalExpuestas:
          type: integer
          minimum: 0
        totalOcultas:
          type: integer
          minimum: 0
        especificacion:
          description: Nulo si la API todavía no tiene especificación.
          oneOf:
            - $ref: '#/components/schemas/ResumenEspecificacion'
            - type: 'null'

    EspecificacionCargada:
      type: object
      required: [apiId, apiNombre, titulo, version, versionOpenApi, formato, cargadaEn, totalRutas, rutas]
      properties:
        apiId:
          type: string
          format: uuid
        apiNombre:
          type: string
        titulo:
          type: string
        descripcion:
          type: [string, 'null']
        version:
          type: string
        versionOpenApi:
          type: string
          pattern: '^3\.(0|1)(\.\d+)?$'
          example: 3.0.3
        formato:
          type: string
          enum: [json, yaml]
        cargadaEn:
          type: string
          format: date-time
        totalRutas:
          type: integer
          minimum: 0
        rutas:
          type: array
          items:
            $ref: '#/components/schemas/RutaAdministrada'

    CambioExposicionRuta:
      type: object
      required: [rutaId, expuesta]
      properties:
        rutaId:
          type: string
          format: uuid
        expuesta:
          type: boolean

    PeticionPersonalizacionPortal:
      type: object
      required: [color]
      properties:
        nombre:
          type: [string, 'null']
        color:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
        bienvenida:
          type: [string, 'null']
          maxLength: 280

    RutaVistaPreviaPortal:
      type: object
      required: [metodo, patron, pesoLlamadas]
      properties:
        metodo: { type: string }
        patron: { type: string }
        resumen: { type: [string, 'null'] }
        descripcion: { type: [string, 'null'] }
        ejemploPeticion: { description: Objeto, lista o escalar JSON del ejemplo de petición; nulo si no hay ejemplo. }
        ejemploRespuesta: { description: Objeto, lista o escalar JSON del ejemplo de respuesta; nulo si no hay ejemplo. }
        codigoRespuesta: { type: [integer, 'null'] }
        pesoLlamadas: { type: integer, minimum: 1 }

    PlanVistaPreviaPortal:
      type: object
      required: [id, nombre, descripcion, precio, esGratuito, vigenciaDias, cuotaLlamadas, limiteMinuto]
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        descripcion: { type: string }
        precio: { type: number }
        esGratuito: { type: boolean }
        vigenciaDias: { type: integer, minimum: 1 }
        cuotaLlamadas: { type: integer, minimum: 1 }
        limiteMinuto: { type: integer, minimum: 1 }

    PersonalizacionPortal:
      type: object
      required: [apiId, apiNombre, nombreOrganizacion, urlPortal, nombre, color, bienvenida, tieneLogo, urlLogo, descripcionApi, rutas, planes]
      properties:
        apiId: { type: string, format: uuid }
        apiNombre: { type: string }
        nombreOrganizacion: { type: string }
        urlPortal: { type: string, format: uri }
        nombre: { type: [string, 'null'] }
        color: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
        bienvenida: { type: [string, 'null'] }
        tieneLogo: { type: boolean }
        urlLogo: { type: [string, 'null'] }
        descripcionApi: { type: [string, 'null'] }
        rutas:
          type: array
          items: { $ref: '#/components/schemas/RutaVistaPreviaPortal' }
        planes:
          type: array
          items: { $ref: '#/components/schemas/PlanVistaPreviaPortal' }

    Problema:
      type: object
      description: ProblemDetails de la API de control.
      required: [title, status, codigo]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        codigo:
          type: string
          enum: [datos_invalidos, csrf, api_no_encontrada, subdominio_ocupado, origen_no_permitido, origen_inaccesible, especificacion_invalida, correo_no_verificado, publicacion_incompleta, plan_sin_dominio_propio, limite_del_plan, logo_invalido]
        detalle:
          type: object
          additionalProperties: true
        errores:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
