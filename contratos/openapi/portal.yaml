openapi: 3.1.0
info:
  title: API de Control - Portal
  version: 1.0.0
  description: Configuración, logotipo y documentación pública del portal de marca blanca resuelto por host.
servers:
  - url: https://{subdominio}.shapi.localhost
    description: Portal de una API detrás del borde
    variables:
      subdominio:
        default: envios

paths:
  /api/portal/configuracion:
    get:
      summary: Obtiene la configuración pública del portal
      operationId: obtenerConfiguracionPortal
      responses:
        '200':
          description: Configuración de la API publicada que corresponde al host.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfiguracionPortal'
        '404':
          description: El host no corresponde a una API publicada.

  /api/portal/logo:
    get:
      summary: Obtiene el logotipo del portal
      operationId: obtenerLogoPortal
      responses:
        '200':
          description: Logotipo configurado para el portal.
          headers:
            X-Content-Type-Options:
              description: Evita que el navegador interprete un tipo distinto al declarado.
              schema:
                type: string
                const: nosniff
            Content-Security-Policy:
              description: Para SVG se envía `sandbox`.
              schema:
                type: string
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/svg+xml:
              schema:
                type: string
                format: binary
        '404':
          description: El host no corresponde a una API publicada o el portal no tiene logotipo.

  /api/portal/documentacion:
    get:
      summary: Obtiene la documentación pública de las rutas expuestas
      operationId: obtenerDocumentacionPortal
      responses:
        '200':
          description: Documentación generada desde la especificación de la API publicada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentacionPortal'
        '404':
          description: El host no corresponde a una API publicada.

components:
  schemas:
    ConfiguracionPortal:
      type: object
      required:
        - nombrePortal
        - colorPrincipal
        - urlLogo
        - bienvenida
        - nombreApi
        - descripcionApi
        - hostPortal
        - hostApi
        - nombreOrganizacion
      properties:
        nombrePortal:
          type: string
          description: Nombre personalizado; si no existe, se usa el nombre de la API.
        colorPrincipal:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          example: '#B8322A'
        urlLogo:
          type: [string, 'null']
          example: /api/portal/logo
        bienvenida:
          type: [string, 'null']
        nombreApi:
          type: string
        descripcionApi:
          type: [string, 'null']
        hostPortal:
          type: string
          example: envios.shapi.localhost
        nombreOrganizacion:
          type: string
          description: Nombre de la organización dueña de la API; el pie del portal lo muestra con su insignia.
          example: Envíos Xelajú, S.A.
        hostApi:
          type: string
          example: envios.api.shapi.localhost
    DocumentacionPortal:
      type: object
      required: [rutas]
      properties:
        rutas:
          type: array
          items:
            $ref: '#/components/schemas/RutaDocumentada'
    RutaDocumentada:
      type: object
      required:
        - metodo
        - patron
        - resumen
        - descripcion
        - parametros
        - ejemploPeticion
        - ejemploRespuesta
        - codigoRespuesta
        - pesoLlamadas
        - urlCompleta
      properties:
        metodo:
          type: string
          example: POST
        patron:
          type: string
          example: /cotizaciones
        resumen:
          type: [string, 'null']
        descripcion:
          type: [string, 'null']
          description: Markdown proveniente de la especificación OpenAPI.
        parametros:
          type: array
          items:
            $ref: '#/components/schemas/ParametroDocumentado'
        ejemploPeticion:
          description: Ejemplo JSON de cuerpo o valores de parámetros, si la especificación lo incluye.
          oneOf:
            - type: object
              additionalProperties: true
            - type: array
              items: {}
            - type: string
            - type: number
            - type: boolean
            - type: 'null'
        ejemploRespuesta:
          description: Ejemplo JSON de la primera respuesta exitosa que lo incluya.
          oneOf:
            - type: object
              additionalProperties: true
            - type: array
              items: {}
            - type: string
            - type: number
            - type: boolean
            - type: 'null'
        codigoRespuesta:
          type: [integer, 'null']
          example: 200
        pesoLlamadas:
          type: integer
          minimum: 1
        urlCompleta:
          type: string
          format: uri
          example: https://envios.api.shapi.localhost/cotizaciones
    ParametroDocumentado:
      type: object
      required: [nombre, tipo, obligatorio, descripcion]
      properties:
        nombre:
          type: string
        tipo:
          type: string
          example: string
        obligatorio:
          type: boolean
        descripcion:
          type: [string, 'null']
