openapi: 3.1.0
info:
  title: API de pagos de Shapi
  version: 1.0.0
paths:
  /api/pagos:
    get:
      summary: Consulta el historial de pagos de plataforma de la organización
      operationId: listarPagosPlataforma
      parameters:
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Tamano'
      responses:
        '200':
          description: Historial paginado de pagos de plataforma
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PagosPaginados' }
        '400':
          description: Parámetros de paginación inválidos (`datos_invalidos`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '401':
          description: Sesión requerida
        '403':
          description: Se requiere el rol propietario o lector
  /api/portal/pagos:
    get:
      summary: Consulta el historial de pagos del consumidor en la API actual
      operationId: listarPagosDelConsumidor
      parameters:
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Tamano'
      responses:
        '200':
          description: Historial de pagos de la API del portal actual
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PagosPaginados' }
        '400':
          description: Parámetros de paginación inválidos (`datos_invalidos`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '401':
          description: Sesión de consumidor requerida
        '403':
          description: Se requiere una sesión del consumidor
        '404':
          description: El host no corresponde a un portal disponible
components:
  parameters:
    Pagina:
      name: pagina
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
    Tamano:
      name: tamano
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
  schemas:
    PagosPaginados:
      type: object
      required: [elementos, total]
      properties:
        elementos:
          type: array
          items: { $ref: '#/components/schemas/Pago' }
        total: { type: integer, minimum: 0 }
    Pago:
      type: object
      required: [id, fecha, concepto, descripcion, monto, moneda, medioPago, estado]
      properties:
        id: { type: string, format: uuid }
        fecha: { type: string, format: date-time, description: Fecha UTC de registro del pago }
        concepto:
          type: string
          enum: [contratacion, renovacion, cambioPlan, reactivacion]
        descripcion: { type: string }
        periodoInicio: { type: [string, 'null'], format: date-time }
        periodoFin: { type: [string, 'null'], format: date-time }
        monto: { type: number, format: decimal }
        moneda: { type: string, const: GTQ }
        medioPago:
          oneOf:
            - $ref: '#/components/schemas/MedioPago'
            - type: 'null'
        estado:
          type: string
          enum: [autorizado, rechazado, revertido]
    MedioPago:
      type: object
      required: [marca, ultimos4]
      properties:
        marca:
          type: string
          enum: [visa, mastercard, americanExpress]
        ultimos4: { type: string, pattern: '^\\d{4}$' }
    Problema:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        codigo: { type: string }
        errores: { type: object, additionalProperties: { type: array, items: { type: string } } }
