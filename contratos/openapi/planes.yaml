openapi: 3.1.0
info:
  title: API de Planes de Shapi
  version: 1.0.0
paths:
  /api/planes-plataforma:
    get:
      summary: Lista los planes de plataforma activos por orden
      operationId: listarPlanesPlataforma
      responses:
        "200":
          description: Planes de plataforma disponibles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlanPlataforma"
  /api/apis/{apiId}/planes:
    get:
      summary: Obtiene los planes de una API
      operationId: obtenerPlanes
      parameters:
        - name: apiId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Lista de planes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlanApi"
        "400":
          description: Petición inválida
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
        "403":
          description: No tiene permisos
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
        "404":
          description: API no encontrada
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
    post:
      summary: Crea un plan de API
      operationId: crearPlan
      parameters:
        - name: apiId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PeticionPlanApi"
      responses:
        "200":
          description: Plan creado exitosamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanApi"
        "400":
          description: Petición inválida
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
        "403":
          description: No tiene permisos
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
        "404":
          description: API no encontrada
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
        "409":
          description: Conflicto
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
  /api/apis/{apiId}/planes/{planId}:
    put:
      summary: Edita un plan de API
      operationId: editarPlan
      parameters:
        - name: apiId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: planId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PeticionPlanApi"
      responses:
        "200":
          description: Plan editado exitosamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanApi"
        "422":
          description: |
            Se intentó cambiar entre gratuito y de pago mientras el plan tiene suscripciones vigentes
            (`plan_con_suscripciones`, 09 §5).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
        "400":
          description: Petición inválida
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
        "403":
          description: No tiene permisos
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
        "404":
          description: API o plan no encontrado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
        "409":
          description: Conflicto
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
  /api/apis/{apiId}/planes/{planId}/desactivar:
    post:
      summary: Desactiva un plan de API
      operationId: desactivarPlan
      parameters:
        - name: apiId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: planId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Plan desactivado exitosamente
        "400":
          description: Petición inválida
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
        "403":
          description: No tiene permisos
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
        "404":
          description: API o plan no encontrado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"

  /api/portal/planes:
    get:
      summary: Obtiene los planes activos para el portal público de una API
      description: Ordenados por precio y nombre, como en A4.1.
      operationId: obtenerPlanesPortal
      responses:
        "200":
          description: Lista de planes activos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlanApi"
        "404":
          description: El host no corresponde a ningún portal (`api_no_encontrada`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
components:
  schemas:
    PlanPlataforma:
      type: object
      required: [id, nombre, descripcion, precio, moneda, vigenciaDias, cuotaPeticiones, dominioPropio, esPrueba, inicioCicloPrevisto]
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        descripcion: { type: string }
        precio: { type: number }
        moneda: { type: string, const: GTQ }
        vigenciaDias: { type: integer }
        maxApis: { type: [integer, "null"] }
        maxMiembros: { type: [integer, "null"] }
        cuotaPeticiones: { type: integer, format: int64 }
        dominioPropio: { type: boolean }
        esPrueba: { type: boolean }
        inicioCicloPrevisto: { type: string, format: date-time }
    PlanApi:
      type: object
      required:
        - id
        - apiId
        - nombre
        - descripcion
        - precio
        - esGratuito
        - vigenciaDias
        - cuotaLlamadas
        - limiteMinuto
        - activo
        - moneda
      properties:
        id:
          type: string
          format: uuid
        apiId:
          type: string
          format: uuid
        nombre:
          type: string
        descripcion:
          type: string
        precio:
          type: number
          description: Mayor que 0 si el plan no es gratuito; 0 si es gratuito. Hasta 2 decimales.
        moneda:
          type: string
          const: GTQ
        esGratuito:
          type: boolean
        vigenciaDias:
          type: integer
        cuotaLlamadas:
          type: integer
        limiteMinuto:
          type: integer
        activo:
          type: boolean
    PeticionPlanApi:
      type: object
      required:
        - nombre
        - descripcion
        - precio
        - esGratuito
        - vigenciaDias
        - cuotaLlamadas
        - limiteMinuto
      properties:
        nombre:
          type: string
        descripcion:
          type: string
        precio:
          type: number
        esGratuito:
          type: boolean
        vigenciaDias:
          type: integer
        cuotaLlamadas:
          type: integer
        limiteMinuto:
          type: integer
    Problema:
      type: object
      description: ProblemDetails de la API de control.
      required: [title, status, codigo]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        codigo:
          type: string
          enum: [datos_invalidos, csrf, api_no_encontrada, plan_no_encontrado, plan_duplicado, plan_con_suscripciones]
        detalle:
          type: object
          additionalProperties: true
        errores:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
