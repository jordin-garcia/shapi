openapi: 3.1.0
info:
  title: API de Control - Identidad
  version: 1.0.0
  description: |
    Identidad del personal (EM-02/EM-04) y autenticación del consumidor en portales (EM-05).
    La sesión del personal viaja en `shapi_sesion`; la del consumidor en `portal_sesion`, limitada al host del portal.
    Todo método distinto de GET exige la cabecera `X-Requested-With: shapi`; si falta, responde 403 `csrf` (10 §1).
    Los errores siguen ProblemDetails con `codigo` (convenciones §5). Un cuerpo que no es un JSON válido responde
    400 `datos_invalidos`, sin `errores`.
    Todo endpoint exige una sesión salvo los que no declaran `security` (04: se deniega por defecto).
servers:
  - url: https://shapi.localhost
    description: Panel del proveedor detrás del borde (la API escucha en http://localhost:5080)

paths:
  /api/auth/registro:
    post:
      summary: Registra un proveedor
      description: |
        Crea el usuario, la organización proveedora, la membresía de propietario y la suscripción activa al plan Prueba
        (ciclo de 09 §4), y encola el correo `verificacion_correo` con un enlace que vence a las 24 horas.
        Límite: 10 peticiones por minuto por IP.
      operationId: registrarProveedor
      parameters:
        - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PeticionRegistro'
      responses:
        '200':
          description: Cuenta creada; el correo de verificación quedó en la cola.
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '403':
          $ref: '#/components/responses/Csrf'
        '409':
          description: Ya existe una cuenta con ese correo (`correo_ya_registrado`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'

  /api/auth/verificar-correo:
    post:
      summary: Verifica el correo e inicia la sesión
      description: Marca el correo como verificado y el enlace como usado, y envía la cookie de sesión. Límite de 10 por minuto por IP.
      operationId: verificarCorreo
      parameters:
        - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PeticionVerificacion'
      responses:
        '200':
          description: Correo verificado y sesión iniciada.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/CookieSesion'
        '400':
          $ref: '#/components/responses/CuerpoInvalido'
        '403':
          description: Falta la cabecera CSRF (`csrf`) o la cuenta está desactivada (`cuenta_desactivada`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
        '422':
          description: El enlace no existe, venció o ya se usó (`token_invalido`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'

  /api/auth/reenviar-verificacion:
    post:
      summary: Reenvía el correo de verificación
      description: |
        Genera un enlace nuevo si la cuenta existe y su correo no está verificado, hasta 3 reenvíos por cuenta en una hora
        (el enlace del registro no cuenta). Responde igual exista o no la cuenta y aunque se haya pasado del límite, para
        no revelar qué correos están registrados. Límite de 10 por minuto por IP.
      operationId: reenviarVerificacion
      parameters:
        - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PeticionReenviar'
      responses:
        '200':
          description: Solicitud recibida.
        '400':
          $ref: '#/components/responses/CuerpoInvalido'
        '403':
          $ref: '#/components/responses/Csrf'
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'

  /api/auth/entrar:
    post:
      summary: Inicia la sesión del personal
      description: |
        Tras 5 intentos fallidos seguidos, la cuenta se bloquea 15 minutos. El mensaje de credenciales incorrectas es
        genérico. Límite de 10 por minuto por IP.
      operationId: entrar
      parameters:
        - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PeticionEntrar'
      responses:
        '200':
          description: Sesión iniciada. El destino según el rol se consulta con `GET /api/auth/sesion`.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/CookieSesion'
        '400':
          $ref: '#/components/responses/CuerpoInvalido'
        '401':
          description: El correo o la contraseña no son correctos, o falta alguno de los dos (`credenciales_invalidas`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
        '403':
          description: Falta la cabecera CSRF (`csrf`) o la cuenta está desactivada (`cuenta_desactivada`, solo con la contraseña correcta).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
        '423':
          description: La cuenta está bloqueada por intentos fallidos (`cuenta_bloqueada`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'

  /api/auth/salir:
    post:
      summary: Cierra la sesión
      description: |
        No exige una sesión vigente. Si la cookie corresponde a una sesión, la revoca en el servidor. Siempre borra la
        cookie, también cuando la sesión ya venció.
      operationId: salir
      parameters:
        - $ref: '#/components/parameters/XRequestedWith'
      responses:
        '200':
          description: Sesión revocada, si existía, y cookie borrada.
        '403':
          $ref: '#/components/responses/Csrf'

  /api/auth/sesion:
    get:
      summary: Devuelve la sesión actual
      description: Usuario, organización, rol, si el correo está verificado y el destino según el rol (10 §1).
      operationId: obtenerSesion
      security:
        - cookieSesion: []
      responses:
        '200':
          description: Sesión vigente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sesion'
        '401':
          $ref: '#/components/responses/SinSesion'

  /api/auth/recuperar:
    post:
      summary: Solicita un enlace de recuperación
      description: |
        Genera y encola un correo con el token de recuperación si la cuenta existe. Responde siempre 200 exista o no.
        Límite de 10 por minuto por IP.
      operationId: solicitarRecuperacion
      parameters:
        - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PeticionRecuperar'
      responses:
        '200':
          description: Solicitud recibida.
        '400':
          $ref: '#/components/responses/CuerpoInvalido'
        '403':
          $ref: '#/components/responses/Csrf'
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'

  /api/auth/restablecer:
    post:
      summary: Restablece la contraseña
      description: |
        Cambia la contraseña utilizando el token de un solo uso. Si es exitoso, inicia sesión y revoca todas
        las sesiones previas.
      operationId: restablecerContrasena
      parameters:
        - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PeticionRestablecer'
      responses:
        '200':
          description: Contraseña restablecida y sesión iniciada.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/CookieSesion'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '403':
          $ref: '#/components/responses/Csrf'
        '422':
          description: El enlace venció o ya se usó (`token_invalido`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'

  /api/portal/auth/registro:
    post:
      summary: Registra un consumidor en el portal actual
      description: Crea el consumidor dentro de la organización resuelta por el host. El correo es único por organización. Encola una verificación con la marca del portal y el host canónico `{sub}.{dominio_base}`.
      operationId: registrarConsumidor
      parameters: [{ $ref: '#/components/parameters/XRequestedWith' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PeticionRegistroConsumidor' }
      responses:
        '200': { description: Cuenta creada y correo encolado. }
        '400': { $ref: '#/components/responses/DatosInvalidos' }
        '403': { $ref: '#/components/responses/Csrf' }
        '404': { description: Portal no disponible. }
        '409':
          description: Correo ya registrado en esta organización (`correo_ya_registrado`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '429': { $ref: '#/components/responses/DemasiadasPeticiones' }

  /api/portal/auth/verificar-correo:
    post:
      summary: Verifica el correo del consumidor
      parameters: [{ $ref: '#/components/parameters/XRequestedWith' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PeticionVerificacion' }
      responses:
        '200': { description: Correo verificado e inicio de sesión en el portal. }
        '400': { $ref: '#/components/responses/CuerpoInvalido' }
        '403':
          description: Falta CSRF o la cuenta está desactivada.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '404': { description: Portal no disponible. }
        '422':
          description: El enlace venció, ya se usó o es de otra organización (`token_invalido`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
        '429': { $ref: '#/components/responses/DemasiadasPeticiones' }

  /api/portal/auth/reenviar-verificacion:
    post:
      summary: Reenvía la verificación de correo
      description: Responde siempre 200 y limita los reenvíos a 3 por consumidor en una hora.
      parameters: [{ $ref: '#/components/parameters/XRequestedWith' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PeticionReenviar' }
      responses:
        '200': { description: Solicitud recibida. }
        '403': { $ref: '#/components/responses/Csrf' }
        '429': { $ref: '#/components/responses/DemasiadasPeticiones' }

  /api/portal/auth/entrar:
    post:
      summary: Inicia sesión del consumidor
      description: Crea una cookie `portal_sesion` limitada al host actual. Tras 5 intentos fallidos bloquea la cuenta por 15 minutos.
      parameters: [{ $ref: '#/components/parameters/XRequestedWith' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PeticionEntrar' }
      responses:
        '200': { description: Sesión iniciada. }
        '400': { $ref: '#/components/responses/CuerpoInvalido' }
        '401':
          description: Credenciales incorrectas (`credenciales_invalidas`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '403':
          description: Falta CSRF o la cuenta está desactivada.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '404': { description: Portal no disponible. }
        '423':
          description: Cuenta bloqueada (`cuenta_bloqueada`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '429': { $ref: '#/components/responses/DemasiadasPeticiones' }

  /api/portal/auth/salir:
    post:
      summary: Cierra sesión del consumidor
      parameters: [{ $ref: '#/components/parameters/XRequestedWith' }]
      responses:
        '200': { description: Sesión revocada y cookie borrada. }
        '403': { $ref: '#/components/responses/Csrf' }

  /api/portal/auth/sesion:
    get:
      summary: Devuelve la cuenta y verificación del consumidor
      security: [{ cookiePortalSesion: [] }]
      responses:
        '200':
          description: Sesión vigente para el host y organización actuales.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SesionConsumidor' }
        '401': { $ref: '#/components/responses/SinSesion' }

  /api/portal/auth/recuperar:
    post:
      summary: Solicita la recuperación de la cuenta del portal
      description: Responde 200 exista o no el correo. El mensaje usa marca y host del portal.
      parameters: [{ $ref: '#/components/parameters/XRequestedWith' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PeticionRecuperar' }
      responses:
        '200': { description: Solicitud recibida. }
        '403': { $ref: '#/components/responses/Csrf' }
        '429': { $ref: '#/components/responses/DemasiadasPeticiones' }

  /api/portal/auth/restablecer:
    post:
      summary: Restablece la contraseña del consumidor
      parameters: [{ $ref: '#/components/parameters/XRequestedWith' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PeticionRestablecer' }
      responses:
        '200': { description: Contraseña restablecida; sesiones anteriores revocadas. }
        '400': { $ref: '#/components/responses/DatosInvalidos' }
        '403': { $ref: '#/components/responses/Csrf' }
        '404': { description: Portal no disponible. }
        '422':
          description: El enlace no existe, venció o ya se usó (`token_invalido`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'

  /api/portal/auth/invitacion/{token}:
    get:
      summary: Consulta el correo de la invitación
      operationId: consultarInvitacionConsumidor
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Invitación vigente y correo invitado.
          content:
            application/json:
              schema:
                type: object
                required: [correo]
                properties:
                  correo: { type: string, format: email }
        '404': { description: Portal no disponible. }
        '422':
          description: La invitación venció, ya se usó o es de otra organización (`token_invalido`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
        '429': { $ref: '#/components/responses/DemasiadasPeticiones' }

  /api/portal/auth/invitacion/{token}/aceptar:
    post:
      summary: Acepta una invitación al portal
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/XRequestedWith' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PeticionAceptarInvitacion' }
      responses:
        '200': { description: Consumidor creado con correo verificado y sesión iniciada. }
        '400': { $ref: '#/components/responses/DatosInvalidos' }
        '403': { $ref: '#/components/responses/Csrf' }
        '404': { description: Portal no disponible. }
        '409':
          description: Ya existe una cuenta con ese correo en la organización (`correo_ya_registrado`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '422':
          description: La invitación venció, ya se usó o es de otra organización (`token_invalido`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
        '429': { $ref: '#/components/responses/DemasiadasPeticiones' }

  /api/perfil:
    get:
      summary: Devuelve los datos del perfil
      description: Devuelve el nombre del usuario autenticado.
      operationId: obtenerPerfil
      security:
        - cookieSesion: []
      responses:
        '200':
          description: Perfil devuelto.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Perfil'
        '401':
          $ref: '#/components/responses/SinSesion'
    put:
      summary: Edita el nombre del perfil
      description: Actualiza el nombre del usuario.
      operationId: editarPerfil
      security:
        - cookieSesion: []
      parameters:
        - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PeticionPerfil'
      responses:
        '200':
          description: Nombre actualizado.
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/SinSesion'
        '403':
          $ref: '#/components/responses/Csrf'

  /api/perfil/contrasena:
    post:
      summary: Cambia la contraseña actual
      description: Valida la contraseña actual y si es correcta, establece la nueva y revoca todas las demás sesiones.
      operationId: cambiarContrasena
      security:
        - cookieSesion: []
      parameters:
        - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PeticionCambiarContrasena'
      responses:
        '200':
          description: Contraseña cambiada.
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          description: Sin sesión o la contraseña actual es incorrecta (`credenciales_invalidas`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
        '403':
          $ref: '#/components/responses/Csrf'

components:
  securitySchemes:
    cookieSesion:
      type: apiKey
      in: cookie
      name: shapi_sesion
    cookiePortalSesion:
      type: apiKey
      in: cookie
      name: portal_sesion

  parameters:
    XRequestedWith:
      name: X-Requested-With
      in: header
      required: true
      description: Protección CSRF (10 §1). El cliente del frontend la agrega siempre.
      schema:
        type: string
        const: shapi

  headers:
    CookieSesion:
      description: '`shapi_sesion=<valor>; Path=/; Secure; HttpOnly; SameSite=Lax`. Vence a los 7 días o tras 8 horas de inactividad.'
      schema:
        type: string

  responses:
    DatosInvalidos:
      description: Datos inválidos (`datos_invalidos`), con los errores por campo.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: about:blank
            title: Revise los datos del formulario.
            status: 400
            codigo: datos_invalidos
            errores:
              contrasena:
                - La contraseña debe tener entre 10 y 128 caracteres.
    CuerpoInvalido:
      description: El cuerpo no es un JSON válido (`datos_invalidos`, sin `errores`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
    Csrf:
      description: Falta la cabecera `X-Requested-With`, o el `Origin` no tiene el mismo esquema, host y puerto que la petición (`csrf`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
    SinSesion:
      description: No hay una sesión vigente. Es un ProblemDetails estándar, sin `codigo`.
      content:
        application/problem+json:
          schema:
            type: object
            properties:
              title:
                type: string
              status:
                type: integer
    DemasiadasPeticiones:
      description: Más de 10 peticiones por minuto desde la misma IP (`demasiadas_peticiones`).
      headers:
        Retry-After:
          description: Segundos que hay que esperar.
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'

  schemas:
    PeticionRegistro:
      type: object
      required: [nombre, correo, organizacion, contrasena]
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 120
        correo:
          type: string
          format: email
          maxLength: 254
          description: Una parte local, una arroba y un dominio con al menos un punto, sin espacios.
        organizacion:
          type: string
          minLength: 2
          maxLength: 120
        contrasena:
          type: string
          minLength: 10
          maxLength: 128
          description: No puede ser igual al correo.

    PeticionRegistroConsumidor:
      type: object
      required: [nombre, nombreEmpresa, correo, contrasena]
      properties:
        nombre: { type: string, minLength: 1, maxLength: 120 }
        nombreEmpresa: { type: string, minLength: 2, maxLength: 120 }
        correo: { type: string, format: email, maxLength: 254 }
        contrasena: { type: string, minLength: 10, maxLength: 128, description: No puede ser igual al correo. }
    PeticionAceptarInvitacion:
      type: object
      required: [nombre, nombreEmpresa, contrasena]
      properties:
        nombre: { type: string, maxLength: 120 }
        nombreEmpresa: { type: string, minLength: 2, maxLength: 120 }
        contrasena: { type: string, minLength: 10, maxLength: 128 }
    SesionConsumidor:
      type: object
      required: [consumidor, correoVerificado, destino]
      properties:
        consumidor:
          type: object
          required: [nombre, nombreEmpresa]
          properties:
            nombre: { type: string }
            nombreEmpresa: { type: string }
        correoVerificado: { type: boolean }
        destino:
          type: string
          enum: [/cuenta/suscripcion, /planes]
          description: >-
            A dónde lleva el portal después de iniciar sesión (10 §1): `/cuenta/suscripcion` si el consumidor tiene una
            suscripción vigente (no finalizada) a la API de este portal; si no, `/planes`.

    PeticionVerificacion:
      type: object
      description: Si falta `token`, responde 422 `token_invalido`.
      properties:
        token:
          type: string
          description: El valor del enlace de verificación.

    PeticionReenviar:
      type: object
      description: Si falta `correo`, responde 200 sin hacer nada.
      properties:
        correo:
          type: string
          format: email

    PeticionEntrar:
      type: object
      description: Si falta `correo` o `contrasena`, responde 401 `credenciales_invalidas`.
      properties:
        correo:
          type: string
          format: email
        contrasena:
          type: string

    Sesion:
      type: object
      required: [usuario, organizacion, rol, correoVerificado, destino]
      properties:
        usuario:
          type: object
          required: [nombre, correo]
          properties:
            nombre:
              type: string
            correo:
              type: string
              format: email
        organizacion:
          type: object
          required: [id, nombre]
          properties:
            id:
              type: string
              format: uuid
            nombre:
              type: string
        rol:
          type: string
          enum: [propietario, editor, lector, administrador, soporte]
        correoVerificado:
          type: boolean
        destino:
          type: string
          description: '`/admin/organizaciones` (administrador), `/admin/casos` (soporte) o `/panel/apis` (propietario, editor y lector).'
          enum: [/panel/apis, /admin/organizaciones, /admin/casos]

    Problema:
      type: object
      description: ProblemDetails de la API de control (convenciones §5).
      required: [title, status, codigo]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        codigo:
          type: string
          enum:
            - datos_invalidos
            - correo_ya_registrado
            - credenciales_invalidas
            - cuenta_bloqueada
            - cuenta_desactivada
            - token_invalido
            - csrf
            - demasiadas_peticiones
        errores:
          type: object
          description: Solo en 400. Mensajes por campo, con el nombre del campo en camelCase.
          additionalProperties:
            type: array
            items:
              type: string
    
    PeticionRecuperar:
      type: object
      description: Si falta `correo`, responde 200 sin hacer nada.
      properties:
        correo:
          type: string
          format: email

    PeticionRestablecer:
      type: object
      required: [token, contrasena]
      properties:
        token:
          type: string
        contrasena:
          type: string
          minLength: 10
          maxLength: 128

    Perfil:
      type: object
      required: [nombre]
      properties:
        nombre:
          type: string

    PeticionPerfil:
      type: object
      required: [nombre]
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 120

    PeticionCambiarContrasena:
      type: object
      required: [contrasenaActual, contrasenaNueva]
      properties:
        contrasenaActual:
          type: string
        contrasenaNueva:
          type: string
          minLength: 10
          maxLength: 128
