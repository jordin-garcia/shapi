openapi: 3.1.0
info:
  title: API de Control - Identidad
  version: 1.0.0
paths:
  /api/auth/sesion:
    get:
      summary: Obtiene la sesión actual
      responses:
        "200":
          description: Sesión activa
          content:
            application/json:
              schema:
                type: object
                properties:
                  nombre:
                    type: string
                  rol:
                    type: string
                  nombreOrganizacion:
                    type: string
                    description: Nombre visible de la organización del personal
                  organizacionId:
                    type: string
                    format: uuid
        "401":
          description: No hay sesión
  /api/auth/salir:
    post:
      summary: Revoca la sesión del personal (EM-02)
      parameters:
        - in: header
          name: X-Requested-With
          required: true
          schema:
            type: string
            const: shapi
      responses:
        "204":
          description: Sesión revocada
        "401":
          description: La sesión ya no está activa
        "403":
          description: Solicitud sin protección CSRF
