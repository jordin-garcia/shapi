name: Publicar imágenes

on:
  pull_request:
  push:
    branches: [main]

# Por omisión, solo lectura. packages: write va únicamente en el job que publica en GHCR: verificar-ambiente ejecuta
# código del PR (pnpm install, Playwright) y no debe recibirlo (auditoría 2026-10-03, H-44).
permissions:
  contents: read

jobs:
  publicar:
    name: publicar-${{ matrix.nombre }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - nombre: api
            dockerfile: src/Shapi.Api/Dockerfile
          - nombre: compuerta
            dockerfile: src/Shapi.Compuerta/Dockerfile
          - nombre: trabajador
            dockerfile: src/Shapi.Trabajador/Dockerfile
          - nombre: borde
            dockerfile: infra/borde/Dockerfile
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - if: github.event_name == 'push'
        # v4.6.0; fijada por SHA porque recibe GITHUB_TOKEN (H-109).
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - # v7.4.0; fijada por SHA porque corre con las credenciales de GHCR y recibe GITHUB_TOKEN (H-109, auditoría H-43).
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/jordin-garcia/shapi-${{ matrix.nombre }}:latest
            ghcr.io/jordin-garcia/shapi-${{ matrix.nombre }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.nombre }}
          cache-to: type=gha,mode=max,scope=${{ matrix.nombre }}

  verificar-ambiente:
    # Check obligatorio: con needs, GitHub antepone success() y, si falla una imagen, el job se omitiría y contaría como
    # aprobado. !cancelled() lo ejecuta igual (construye las imágenes con --build) para que falle él también.
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    needs: publicar
    name: ambiente-productivo
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: tests/e2e/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: tests/e2e/pnpm-lock.yaml
      - name: Preparar configuración local
        run: cp .env.example .env
      - name: Levantar desde cero
        run: docker compose --env-file .env -f infra/compose.yml -f infra/compose.prod.yml up -d --build
      # JZ-17: primero comprueba el ambiente sin siembra; después siembra la demostración dentro del trabajador y
      # llama a la compuerta con una clave fija de la siembra.
      - name: Verificar ambiente y sembrar la demostración
        run: node infra/verificar.mjs --sembrar
      # JG-18: las pruebas E2E también corren en el PR, con el ambiente que este job ya levantó (unos 30 s más). Antes
      # solo corrían en main (e2e.yml), así que un flujo roto se descubría después de integrar.
      - name: Instalar pruebas E2E y navegador
        working-directory: tests/e2e
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Pruebas E2E
        working-directory: tests/e2e
        env:
          CI: "true"
        run: pnpm test
      - name: Adjuntar informe de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: informe-playwright-pr
          path: tests/e2e/playwright-report
          if-no-files-found: ignore
          retention-days: 7
      - name: Mostrar registros si falla
        if: failure()
        run: docker compose --env-file .env -f infra/compose.yml -f infra/compose.prod.yml logs
      - name: Apagar y borrar los datos efímeros
        if: always()
        run: docker compose --env-file .env -f infra/compose.yml -f infra/compose.prod.yml down -v
