# Responde a @claude en comentarios de issues y PR (JG-03). Usa la suscripción de Jordin (CLAUDE_CODE_OAUTH_TOKEN).
# La acción solo acepta a usuarios con permiso de escritura. Vive aparte de revision-claude.yml para que los
# comentarios no generen un check "revision-claude" omitido, que contaría como aprobado.
name: Claude interactivo

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read

jobs:
  interactivo:
    name: claude-interactivo
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          claude_args: >-
            --model claude-opus-5-5
            --effort high
