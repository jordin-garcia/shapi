# Verificaciones obligatorias para integrar en main (convenciones §4): plan, backend y frontend.
# Los nombres de los jobs son los que exige la protección de la rama: no cambiarlos.
# El título del PR lo valida titulo-pr.yml (check `titulo`), para que editar el PR no repita esta CI.
name: CI

on:
  pull_request:
    # Sin edited: editar el título o la descripción no cambia el código (el título lo valida titulo-pr.yml).
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # En los PR se cancela la ejecución anterior; en main se verifica cada commit.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Validar las tareas del plan
        run: node scripts/tareas.mjs --validar
      # Node no recorre directorios con --test: se le pasa el patrón entre comillas y lo expande él.
      - name: Pruebas de los scripts
        run: node --test "scripts/*.test.mjs"

  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restaurar
        run: dotnet restore Shapi.slnx
      - name: Compilar
        run: dotnet build Shapi.slnx --no-restore --configuration Release
      - name: Formato
        run: dotnet format Shapi.slnx --verify-no-changes --no-restore
      # Un cambio del modelo sin su migración falla aquí y no al levantar la base (convenciones §3).
      # dotnet-ef se instala con la misma versión de EF Core que usa la solución.
      - name: Migraciones al día con el modelo
        run: |
          dotnet tool install --global dotnet-ef --version "$(sed -n 's/.*"Microsoft.EntityFrameworkCore.Design" Version="\([^"]*\)".*/\1/p' Directory.Packages.props)"
          dotnet ef migrations has-pending-model-changes -p src/Shapi.Infraestructura -s src/Shapi.Api --no-build --configuration Release
      # Docker ya está disponible en ubuntu-latest para Testcontainers.
      # -m:1 corre un proyecto de pruebas a la vez (JG-18). Shapi.Api.Tests ocupa toda la CPU desde que comparte un
      # solo PostgreSQL, y en paralelo dejaba sin CPU a las pruebas de la compuerta que miden tiempos.
      - name: Pruebas
        run: dotnet test Shapi.slnx --no-build --configuration Release -m:1

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - name: Buscar el frontend
        id: frontend
        working-directory: .
        run: |
          if [ -f frontend/package.json ]; then
            echo "existe=true" >> "$GITHUB_OUTPUT"
          else
            echo "existe=false" >> "$GITHUB_OUTPUT"
            echo "Todavía no existe frontend/package.json (lo crea DC-01): no hay nada que verificar."
          fi
      - if: steps.frontend.outputs.existe == 'true'
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - if: steps.frontend.outputs.existe == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - if: steps.frontend.outputs.existe == 'true'
        run: pnpm install --frozen-lockfile
      # Los tipos de packages/api/src/generado/ salen de contratos/openapi/ y nunca se escriben a mano.
      # git status detecta también un contrato nuevo sin sus tipos, que git diff no ve.
      - name: Tipos generados al día con los contratos
        if: steps.frontend.outputs.existe == 'true'
        run: |
          pnpm generar:api
          if [ -n "$(git status --porcelain -- packages/api/src/generado)" ]; then
            git status --short -- packages/api/src/generado
            echo "::error::Los tipos generados no coinciden con contratos/openapi/. Ejecute 'pnpm generar:api' en frontend/ y haga commit del resultado."
            exit 1
          fi
      - if: steps.frontend.outputs.existe == 'true'
        run: pnpm lint
      - if: steps.frontend.outputs.existe == 'true'
        run: pnpm typecheck
      - if: steps.frontend.outputs.existe == 'true'
        run: pnpm test
      - if: steps.frontend.outputs.existe == 'true'
        run: pnpm build
