name: PDF

on:
  pull_request:
    paths:
      - "scripts/generar-pdf*"
      - "scripts/pdf/**"
      - "docs/pdf/**"
      - "docs/specs/**"
      - "frontend/package.json"
      - "frontend/pnpm-lock.yaml"
      - "tests/e2e/package.json"
      - "tests/e2e/pnpm-lock.yaml"
      - ".github/workflows/pdf.yml"
  push:
    branches: [main]
    paths:
      - "scripts/generar-pdf*"
      - "scripts/pdf/**"
      - "docs/pdf/**"
      - "docs/specs/**"
      - ".github/workflows/pdf.yml"

permissions:
  contents: read

jobs:
  pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Instalar pnpm del proyecto
        run: npm install --global pnpm@11.0.0
      - name: Instalar herramientas existentes
        run: |
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir tests/e2e install --frozen-lockfile
          pnpm --dir tests/e2e exec playwright install --with-deps chromium
      - name: Preparar Mermaid CLI sin descargar otro navegador
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: npx --yes @mermaid-js/mermaid-cli@11.12.0 --version
      # Chromium recomienda reutilizar este helper SUID de Chrome en Ubuntu con
      # restricciones de AppArmor. Conserva el sandbox sin cambiar el kernel.
      - name: Configurar el sandbox de Chromium en Ubuntu
        run: |
          test -u /opt/google/chrome/chrome-sandbox
          echo "CHROME_DEVEL_SANDBOX=/opt/google/chrome/chrome-sandbox" >> "$GITHUB_ENV"
      - name: Pruebas del generador y del PDF con Chromium y Mermaid
        run: |
          node --test scripts/generar-pdf.test.mjs
          node --test scripts/pdf/generar-pdf.test.mjs
