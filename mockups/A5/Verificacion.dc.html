<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Sora:wght@300;400;500;600&display=swap">
  <style>
    body { margin:0; background:#F4F6FA; color:#0B1220; font-family:"IBM Plex Sans","Segoe UI",Helvetica,Arial,sans-serif; font-size:16px; line-height:1.6; -webkit-font-smoothing:antialiased; }
    a { color:var(--marca-principal, #B8322A); text-decoration:none; }
    a:hover { color:var(--marca-principal, #B8322A); text-decoration:underline; }
    h1,h2 { font-family:"Sora","Segoe UI",Helvetica,Arial,sans-serif; font-weight:400; margin:0; letter-spacing:-0.02em; }
    p { margin:0; }
    .et { font-size:12px; letter-spacing:.16em; text-transform:uppercase; color:#5A6884; font-weight:500; margin:0; }
    .lbl { font-size:13px; font-weight:600; color:#0B1220; }
    .campo { border:1px solid #C9D2E1; border-radius:8px; padding:11px 14px; font-size:15px; color:#0B1220; background:#FFFFFF; }
    .foco { border-color:var(--marca-principal); box-shadow:0 0 0 3px color-mix(in srgb, var(--marca-principal) 17%, #FFFFFF); }
  </style>
</helmet>

<div style="--marca-principal:#B8322A; width:1440px; height:900px; background:#F4F6FA; display:flex; flex-direction:column; overflow:hidden;">

  <div style="height:76px; background:#FFFFFF; border-bottom:1px solid #DCE3EE; display:flex; align-items:center; padding:0 80px; flex-shrink:0; box-sizing:border-box;">
    <div style="display:flex; align-items:center; gap:11px;">
      <div style="width:28px; height:28px; border-radius:6px; background:var(--marca-principal); color:#FFFFFF; display:flex; align-items:center; justify-content:center; font-family:Sora,Helvetica,Arial,sans-serif; font-size:11px; font-weight:600; letter-spacing:-0.02em;">EX</div>
      <span style="font-family:Sora,Helvetica,Arial,sans-serif; font-size:20px; font-weight:500; letter-spacing:-0.03em; color:#0B1220;">Envíos Xelajú</span>
    </div>
  </div>

  <div style="flex-grow:1; display:flex; align-items:center; justify-content:center; padding:44px 80px;">
    <div style="width:460px; background:#FFFFFF; border:1px solid #DCE3EE; border-radius:8px; padding:40px;">

      <svg width="40" height="40" viewBox="0 0 24 24" fill="none">
        <rect x="2" y="5" width="20" height="14" rx="3" stroke="var(--marca-principal)" stroke-width="1.5"></rect>
        <path d="M3.5 7.5 L12 13.5 L20.5 7.5" stroke="var(--marca-principal)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>

      <div style="display:flex; flex-direction:column; gap:8px; margin-top:24px;">
        <p class="et">Portal de Envíos Xelajú</p>
        <h1 style="font-size:32px; line-height:1.2;">Revise su correo</h1>
      </div>

      <p style="font-size:16px; line-height:1.6; color:#5A6884; margin-top:20px;">Enviamos un enlace de confirmación a <span style="color:#0B1220; font-weight:500;">mariajose@mercaditoantigua.com</span>. Vence en <span style="color:#0B1220; font-weight:500;">24 horas</span>.</p>

      <div style="background:#FBE9E3; border:1px solid #EDC3B4; border-radius:8px; padding:14px 16px; margin-top:24px;">
        <p style="font-size:14px; line-height:1.5; color:#8E3315;">Podrá contratar un plan en cuanto confirme su correo.</p>
      </div>

      <p style="font-size:14px; color:#5A6884; text-align:center; margin-top:28px;">¿No le llegó? <a href="#">Enviar el enlace otra vez</a></p>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
